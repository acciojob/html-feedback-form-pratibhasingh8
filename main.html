<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <form method="POST">
        <label>Name</label>
        <input type="text" id="name" minlength="3" maxlength="50" required="yes"><br><br>

        <label>Portfolio</label>
        <input type="URL" id="portfolio" required="yes"><br><br>

        <label>Favourite Color</label>
        <input type="color" id="favColor"><br><br>

        <label>Likeness</label>
        <input type="range" id="likeness" min="1" max="100" required="yes"><br><br>
        
        <button type="submit">Submit</button>

    </form>
</body>
</html>
